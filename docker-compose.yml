services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: neondb
    ports:
      - "55432:5432"
    volumes:
      - itam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d neondb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  itam_pgdata:
